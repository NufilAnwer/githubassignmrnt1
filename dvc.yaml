stages:

  # ─────────────────────────────────────────────────────────────
  # Stage 1: prepare
  #   Downloads Fashion-MNIST and saves raw .npy arrays.
  #   No hyperparameter dependencies.
  # ─────────────────────────────────────────────────────────────
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/raw

  # ─────────────────────────────────────────────────────────────
  # Stage 2: preprocess
  #   Normalizes pixels and splits train/val sets.
  #   Depends on: preprocess.test_size, preprocess.seed
  # ─────────────────────────────────────────────────────────────
  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw
    params:
      - preprocess.test_size
      - preprocess.seed
    outs:
      - data/processed

  # ─────────────────────────────────────────────────────────────
  # Stage 3: train
  #   Builds and trains the ANN; saves model.h5 + history.csv.
  #   Depends on all train.* hyperparameters.
  # ─────────────────────────────────────────────────────────────
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed
    params:
      - train.dense_units
      - train.dropout_rate
      - train.learning_rate
      - train.epochs
      - train.batch_size
    outs:
      - models/model.h5
      - models/history.csv

  # ─────────────────────────────────────────────────────────────
  # Stage 4: evaluate
  #   Computes test metrics and confusion matrix.
  #   metrics.json is declared as a DVC metric (not a plain output)
  #   so it participates in `dvc metrics show` / `dvc metrics diff`.
  # ─────────────────────────────────────────────────────────────
  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.h5
      - data/processed
    outs:
      - models/confusion_matrix.png
    metrics:
      - metrics.json:
          cache: false
